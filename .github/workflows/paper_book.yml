# .github/workflows/paper_book.yml
name: paper_book

# Runs the local paper book unattended: hydrate committed JSON state -> sync new
# trade setups -> replay (freeze closed fills) -> compute forward-vs-QQQ metrics ->
# commit book_state.json + metrics.json + dashboard.html back to the repo.

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper_book
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper_book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record workflow start
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python agents/ops_recorder.py --phase start --agent workflow_paper_book

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run paper book
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          PAPER_BOOK_STATE_JSON:  paper_book/book_state.json
        run: python scripts/paper_book.py run

      - name: Commit and push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain paper_book/)" ]; then
            echo "No paper-book changes."
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          # Pull BEFORE staging: `git pull --rebase --autostash` pops its stash
          # WITHOUT --index, so anything staged before the pull comes back
          # UNSTAGED and the commit below finds an empty index -> exit 1 under
          # `set -e`. Staging after the rebase keeps the index intact.
          git pull --rebase --autostash || true
          # `git pull --rebase --autostash` EXITS 0 even when re-applying the
          # stash conflicts, leaving unmerged entries with conflict markers on
          # disk. The `git add` below would then RESOLVE them to the marker
          # text and commit it into the ledger. Fail loudly instead.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::error::rebase still in progress after pull; refusing to commit"; exit 1
          fi
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::autostash apply conflicted; refusing to commit merged output"
            git ls-files -u
            exit 1
          fi
          git add paper_book/book_state.json paper_book/metrics.json paper_book/dashboard.html
          if git diff --cached --quiet; then
            echo "Nothing staged after rebase; nothing to commit."
            exit 0
          fi
          git commit -m "chore(paper-book): auto forward mark ${today}"
          git push || (git pull --rebase --autostash && git push)

      - name: Record workflow finish
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WORKFLOW_STATUS:      ${{ job.status }}
        run: python agents/ops_recorder.py --phase finish --agent workflow_paper_book --status "$WORKFLOW_STATUS"
